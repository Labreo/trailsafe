<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Front Ridge Gradient -->
    <linearGradient id="frontRidgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Radar Beacon Glow Gradient -->
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Outer Protective Shield -->
  <path d="M 100 12 
           C 145 28, 178 36, 184 75 
           C 184 125, 148 165, 100 188 
           C 52 165, 16 125, 16 75 
           C 22 36, 55 28, 100 12 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#borderGrad)" 
        stroke-width="4.5" 
        stroke-linejoin="round" />

  <!-- Radar Pulse Rings -->
  <circle cx="100" cy="62" r="38" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="3,3" />
  <circle cx="100" cy="62" r="26" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="100" cy="62" r="14" fill="none" stroke="#34d399" stroke-width="1.8" stroke-opacity="0.6" />

  <!-- Deep Mountain Peaks -->
  <polygon points="100,52 145,135 55,135" fill="url(#mountainGrad)" opacity="0.95" />
  <!-- Snowcap on Peak -->
  <polygon points="100,52 113,76 104,73 100,77 96,73 87,76" fill="#f8fafc" />

  <!-- Secondary Foothill Ridge -->
  <polygon points="68,90 115,150 25,150" fill="#0284c7" opacity="0.8" />
  <polygon points="68,90 78,106 72,104 68,107 64,104 58,106" fill="#e2e8f0" />

  <!-- Foreground Green Forest Ridge -->
  <polygon points="128,100 175,158 85,158" fill="url(#frontRidgeGrad)" opacity="0.9" />

  <!-- Winding Trail Path (Safety Line) -->
  <path d="M 100 182
           C 95 165, 108 152, 98 140
           C 88 128, 104 118, 96 105
           C 92 98, 98 88, 100 80" 
        fill="none" 
        stroke="#fbbf24" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-dasharray="2,3.5" />

  <!-- GPS Beacon / Star at Summit -->
  <circle cx="100" cy="48" r="12" fill="url(#beaconGlow)" />
  <circle cx="100" cy="48" r="4.5" fill="#fef08a" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="100" cy="48" r="1.8" fill="#ffffff" />
</svg>
