name: TrailSafe CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite & Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Environment Verification
        run: |
          python utils/verify_env.py

      - name: Run Pytest Test Suite
        run: |
          pytest -v tests/test_tabpfn_inference.py tests/test_temporal_workflow.py tests/test_e2e_safety_loop.py
